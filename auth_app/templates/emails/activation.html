<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff; margin:0; padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="font-family:Arial, Helvetica, sans-serif;">
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <img src="https://raw.githubusercontent.com/AlxRpp/Videoflix_Backend/main/auth_app/static/img/Logo.png" alt="Videoflix" width="280" style="display:block; border:0; max-width:280px;" />
          </td>
        </tr>
        <tr>
          <td style="color:#1a1a1a; font-size:16px; line-height:26px; padding-bottom:28px;">
            Dear {{ user.username }},<br />
            Thank you for registering with Videoflix. To complete your registration and verify your email address, please click the link below:
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:32px;">
            <a href="{{ activation_link }}" style="display:inline-block; background-color:#2a13d4; color:#ffffff;
                      text-decoration:none; font-size:18px; font-weight:bold;
                      padding:16px 40px; border-radius:40px;">Activate account</a>
          </td>
        </tr>
        <tr>
          <td style="color:#1a1a1a; font-size:16px; line-height:26px;">
            If you did not create an account with us, please disregard this email.
            <br /><br />
            Best regards,
            <br /><br />
            Your Videoflix Team.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
